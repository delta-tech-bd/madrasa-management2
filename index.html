    <style>    
        * { 
            box-sizing: border-box; 
            font-family: 'SolaimanLipi', sans-serif !important; 
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background: #0f172a;
            color: #1e293b; 
        }
        
        .login-overlay { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 99999; 
            padding: 20px; 
            background: #f8fafc;
        }
        .login-overlay.show { display: flex; }
        .login-card { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            border: 1px solid #e2e8f0; 
        }
        .madrasa-logo { 
            width: 90px; 
            height: 90px; 
            margin-bottom: 16px; 
            object-fit: contain; 
        }
        .login-card h2 { 
            margin: 0 0 8px 0; 
            font-size: 24px; 
            font-weight: 700;
            color: #0f172a; 
        }
        .login-card p { 
            margin: 0 0 24px 0; 
            color: #64748b; 
            font-size: 14px; 
            line-height: 1.5;
        }
        
        .error-msg { 
            background: #fef2f2; 
            border: 1px solid #fecaca; 
            color: #dc2626; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 20px; 
            display: none; 
            text-align: center; 
        }
        
        .input-group { 
            margin-bottom: 18px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            margin-bottom: 6px; 
            font-size: 14px; 
            color: #334155;   
            font-weight: 600;
        }
        .input-group input { 
            width: 100%; 
            padding: 12px 16px; 
            background: #f8fafc; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            color: #0f172a; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.2s ease; 
        }
        .input-group input::placeholder {
            color: #94a3b8;
        }
        .input-group input:focus { 
            border-color: #0284c7; 
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); 
        }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 46px;
        }
        .toggle-pass-btn {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 4px;
            color: #64748b;
            user-select: none;
        }
        .toggle-pass-btn:hover { color: #0284c7; }
        
        .login-btn { 
            width: 100%; 
            padding: 14px; 
            background: #0284c7; 
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s ease; 
            margin-top: 6px; 
        }
        .login-btn:hover { background: #0369a1; }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        #bootLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            gap: 12px; z-index: 100000;
            background: #ffffff;
        }
        #bootLoader .spinner {
            width: 36px; height: 36px;
            border: 3px solid #e2e8f0;
            border-top-color: #0284c7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #bootLoader span { color: #64748b; font-size: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-container { 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            display: none; 
            background-color: #0f172a;
            padding-top: env(safe-area-inset-top, 35px);
