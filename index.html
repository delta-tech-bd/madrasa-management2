<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>দারুত তাক্বওয়া হুফফাজুল কোরআন মাদ্রাসা ও এতিমখানা</title>

    <!-- ফেভিকন আইকন -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1BC9yDZx-LEVp1pb0qkm3ue4yPq382PZl=w1000" />
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=SolaimanLipi&display=swap" media="print" onload="this.media='all'" />

    <style>
        * { box-sizing: border-box; font-family: 'SolaimanLipi', sans-serif !important; }
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #0f172a; color: #1e293b; }

        .login-overlay { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; z-index: 99999; padding: 20px; background: #f8fafc; }
        .login-overlay.show { display: flex; }
        .login-card { background: #fff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1), 0 8px 10px -6px rgba(0,0,0,.05); width: 100%; max-width: 420px; text-align: center; border: 1px solid #e2e8f0; }
        .madrasa-logo { width: 90px; height: 90px; margin: 0 auto 16px; display: block; object-fit: contain; }
        .login-card h2 { margin: 0 0 8px; font-size: 24px; font-weight: 700; color: #0f172a; }
        .login-card p { margin: 0 0 24px; color: #64748b; font-size: 14px; line-height: 1.5; }

        .error-msg { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 12px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: none; text-align: center; }

        .input-group { margin-bottom: 18px; text-align: left; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #334155; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px 16px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; color: #0f172a; font-size: 15px; outline: none; transition: all .2s ease; }
        .input-group input:focus { border-color: #0284c7; background: #fff; box-shadow: 0 0 0 3px rgba(2,132,199,.15); }

        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 46px; }
        .toggle-pass-btn { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: #64748b; }

        .login-btn { width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: background .2s ease; margin-top: 6px; }
        .login-btn:hover { background: #0369a1; }
        .login-btn:disabled { background: #94a3b8; cursor: not-allowed; }

        .switch-inst-btn { position: fixed; top: 10px; right: 10px; z-index: 9999; background: rgba(15, 23, 42, 0.7); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; backdrop-filter: blur(4px); }
        .switch-inst-btn:hover { background: #ef4444; border-color: #ef4444; }

        #bootLoader { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; z-index: 100000; background: #fff; }
        #bootLoader .spinner { width: 36px; height: 36px; border: 3px solid #e2e8f0; border-top-color: #0284c7; border-radius: 50%; animation: spin .8s linear infinite; }
        #bootLoader span { color: #64748b; font-size: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .main-container { position: fixed; inset: 0; overflow: hidden; display: none; background-color: #0f172a; padding-top: env(safe-area-inset-top, 35px); padding-bottom: env(safe-area-inset-bottom, 20px); }
        iframe { width: 100%; height: 100%; border: none; display: block; background-color: #0f172a; }
    </style>
</head>
<body>

    <div id="bootLoader">
        <div class="spinner"></div>
        <span>লোড হচ্ছে…</span>
    </div>

    <button class="switch-inst-btn" id="switchBtn" style="display:none;" onclick="logoutAndSwitch()">🔄 Log Out</button>

    <div class="login-overlay" id="loginOverlay">
        <div class="login-card" id="loginCardContainer">
            <img src="https://lh3.googleusercontent.com/d/1BC9yDZx-LEVp1pb0qkm3ue4yPq382PZl=w1000" alt="Madrasa Logo" class="madrasa-logo" />
            <h2>লাইসেন্স ভেরিফিকেশন</h2>
            <p>সফটওয়্যারটি ব্যবহার করতে ইউজারনেম ও পাসওয়ার্ড দিন</p>

            <div class="error-msg" id="errorBlock"></div>

            <div class="input-group">
                <label for="username">ইউজারনেম / ফোন নম্বর</label>
                <input type="text" id="username" placeholder="যেমন: AnasTech" autocomplete="username" required />
            </div>

            <div class="input-group">
                <label for="licenseKey">পাসওয়ার্ড</label>
                <div class="password-wrapper">
                    <input type="password" id="licenseKey" placeholder="যেমন: AnasTech@77" autocomplete="current-password" required />
                    <button type="button" class="toggle-pass-btn" id="togglePassBtn" onclick="togglePasswordVisibility()">👁️</button>
                </div>
            </div>

            <button class="login-btn" id="loginBtn" onclick="performSecureLogin()">🔑 প্রবেশ করুন</button>
        </div>
    </div>

    <div class="main-container" id="mainAppContainer">
        <iframe id="appIframe"></iframe>
    </div>

    <script>
        // প্রতিষ্ঠানের কোড নির্ধারিত
        var INSTITUTION_ID = "ATMS0477";
        var GOOGLE_SCRIPT_API = "https://script.google.com/macros/s/AKfycbzJTmJ6e2_pOrXR5umb4IzklVP-zZqidSH6tNY83EaXlOib1X4upGRHY_PJnhsvf0V_Ew/exec";

        function getSavedSession() { try { return localStorage.getItem('sms_session_token'); } catch (e) { return null; } }
        function getSavedInst() { try { return localStorage.getItem('sms_institution_id'); } catch (e) { return null; } }
        function saveSession(token, inst) {
            try {
                if (token) localStorage.setItem('sms_session_token', token);
                if (inst) localStorage.setItem('sms_institution_id', inst);
            } catch (e) {}
        }
        function clearSavedSession() {
            try {
                localStorage.removeItem('sms_session_token');
                localStorage.removeItem('sms_institution_id');
            } catch (e) {}
        }

        function hideBootLoader() { var l = document.getElementById('bootLoader'); if (l) l.style.display = 'none'; }
        function showBootLoader(text) { var l = document.getElementById('bootLoader'); if (l) { l.querySelector('span').textContent = text || 'লোড হচ্ছে…'; l.style.display = 'flex'; } }
        function showLoginForm() {
            hideBootLoader();
            document.getElementById('switchBtn').style.display = 'none';
            document.getElementById('loginOverlay').classList.add('show');
        }
        function showMsg(text) { var e = document.getElementById('errorBlock'); e.innerText = text; e.style.display = 'block'; }

        var appLoadFinish = null;

        function openApp(instId) {
            document.getElementById('loginOverlay').classList.remove('show');
            document.getElementById('switchBtn').style.display = 'block';
            var frame = document.getElementById('appIframe');
            showBootLoader('লোড হচ্ছে…');

            var BASE = GOOGLE_SCRIPT_API + "?inst=" + encodeURIComponent(instId);

            var done = false;
            appLoadFinish = function () {
                if (done) return;
                done = true;
                hideBootLoader();
            };
            frame.onload = appLoadFinish;
            setTimeout(appLoadFinish, 15000);

            frame.src = BASE + "&loadApp=true&session=" + encodeURIComponent(getSavedSession() || '');
            document.getElementById('mainAppContainer').style.display = 'block';
        }

        function logoutAndSwitch() {
            clearSavedSession();
            document.getElementById('mainAppContainer').style.display = 'none';
            document.getElementById('appIframe').removeAttribute('src');
            // লগআউটের পর লগইন বাটন যেন আটকে না থাকে
            var btn = document.getElementById('loginBtn');
            btn.innerText = "🔑 প্রবেশ করুন";
            btn.disabled = false;
            showLoginForm();
        }

        function togglePasswordVisibility() {
            var pw = document.getElementById('licenseKey');
            var btn = document.getElementById('togglePassBtn');
            if (pw.type === 'password') { pw.type = 'text'; btn.innerText = '🙈'; }
            else { pw.type = 'password'; btn.innerText = '👁️'; }
        }

        window.addEventListener('DOMContentLoaded', function () {
            var savedInst = getSavedInst();
            var savedToken = getSavedSession();

            if (savedInst === INSTITUTION_ID && savedToken) {
                openApp(savedInst);
            } else {
                showLoginForm();
            }
        });

        function performSecureLogin() {
            var inst = INSTITUTION_ID;
            var user = document.getElementById('username').value.trim();
            var key = document.getElementById('licenseKey').value.trim();
            var btn = document.getElementById('loginBtn');

            if (!user || !key) {
                showMsg('❌ ইউজারনেম এবং পাসওয়ার্ড দুটোই সঠিকভাবে দিন।');
                return;
            }

            document.getElementById('errorBlock').style.display = 'none';
            btn.innerText = "যাচাই করা হচ্ছে...";
            btn.disabled = true;

            var BASE = GOOGLE_SCRIPT_API + "?inst=" + encodeURIComponent(inst);

            fetch(BASE + "&user=" + encodeURIComponent(user) + "&key=" + encodeURIComponent(key))
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.success) {
                        btn.innerText = "🎉 সফল হয়েছে!";
                        saveSession(data.session, inst);
                        openApp(inst);
                    } else {
                        showMsg("❌ " + (data && data.error ? data.error : "ভুল ইউজারনেম অথবা পাসওয়ার্ড!"));
                        btn.innerText = "🔑 প্রবেশ করুন";
                        btn.disabled = false;
                    }
                })
                .catch(function () {
                    showMsg("❌ নেটওয়ার্ক বা সার্ভারে সংযোগ করতে সমস্যা হয়েছে!");
                    btn.innerText = "🔑 প্রবেশ করুন";
                    btn.disabled = false;
                });
        }
    </script>
</body>
</html>
